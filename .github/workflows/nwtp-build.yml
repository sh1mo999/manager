name: NoxWoodsTeleport Java 25 CI
on:
  push:
    branches: [codex/noxwoodsteleport-build]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Extract source
        run: |
          base64 -d noxwoodsteleport-build-source.b64 | tar -xJ
      - name: Compile and smoke test
        working-directory: NoxWoodsTeleport-1.0.0
        run: |
          set -o pipefail
          gradle --no-daemon clean jar smokePolicy 2>&1 | tee ../nwtp-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NoxWoodsTeleport-CI
          path: |
            nwtp-build.log
            NoxWoodsTeleport-1.0.0/build/libs/*.jar
