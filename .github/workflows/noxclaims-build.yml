name: NoxWoodsClaims Java 25 CI
on:
  push:
    branches: [codex/noxwoodsclaims-build]
    paths:
      - noxwoodsclaims-build-source.b64
      - .github/workflows/noxclaims-build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Unpack source
        run: |
          base64 -d noxwoodsclaims-build-source.b64 | tar -xJ
          find NoxWoodsClaims/src/main/java -name '*.java' | wc -l
      - name: Compile and run smoke tests
        working-directory: NoxWoodsClaims
        run: |
          set -o pipefail
          gradle --no-daemon clean jar smokeCore smokeProtection smokeAccess smokeEconomy smokeTransfer 2>&1 | tee ../noxclaims-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NoxWoodsClaims-build-results
          path: |
            noxclaims-build.log
            NoxWoodsClaims/build/libs/*.jar
          if-no-files-found: warn
